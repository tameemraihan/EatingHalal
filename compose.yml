services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: eatinghalal
      POSTGRES_USER: eatinghalal
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eatinghalal"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
